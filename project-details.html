    <style>
        /* Project screenshots carousel */

        .project-carousel {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 30px auto 50px;
            overflow: hidden;
            border-radius: 16px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #151515;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            width: 100%;
            flex-shrink: 0;
        }

        .carousel-slide img {
            display: block;
            width: 100%;
            height: 500px;
            object-fit: contain;
            background: #151515;
        }

        /* Previous and next buttons */

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.75);
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 2;
            transition: 0.3s;
        }

        .carousel-btn:hover {
            background: linear-gradient(90deg, #6465F1, #A556F7);
        }

        .carousel-prev {
            left: 15px;
        }

        .carousel-next {
            right: 15px;
        }

        /* Navigation dots */

        .carousel-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 18px 0;
        }

        .carousel-dot {
            width: 9px;
            height: 9px;
            border: none;
            border-radius: 50%;
            background: #777;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
        }

        .carousel-dot.active {
            width: 25px;
            border-radius: 10px;
            background: linear-gradient(90deg, #6465F1, #A556F7);
        }

        /* Project descriptions */

        .project-description {
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .project-description h2 {
            margin-bottom: 20px;
        }

        .project-description h3 {
            margin-top: 30px;
            margin-bottom: 12px;
        }

        .project-description p {
            margin-bottom: 18px;
            line-height: 1.9;
        }

        .project-description ul {
            padding-left: 25px;
            margin-bottom: 20px;
        }

        .project-description li {
            margin-bottom: 8px;
        }

        /* Header alignment */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .theme-toggle {
            margin-left: auto !important;
        }

        /* Responsive design */

        @media (max-width: 768px) {
            .project-carousel {
                margin: 20px auto 35px;
            }

            .carousel-slide img {
                height: 300px;
            }

            .carousel-btn {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .project-description {
                padding: 0 15px;
            }
        }

        @media (max-width: 480px) {
            .carousel-slide img {
                height: 220px;
            }

            .carousel-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
        }
    </style>
</head>

            function renderProject() {

            const base = projectDetails[projectId];
            const project = base ? Object.assign({}, base, (lang === 'fr' && projectDetailsFr[projectId]) || {}) : null;


            if (project) {

                // Generate carousel slides

                const slides = project.screenshots.map((image, index) => `
                    <div class="carousel-slide">
                        <img
                            src="${image}"
                            alt="${project.title} - Screenshot ${index + 1}"
                            loading="${index === 0 ? 'eager' : 'lazy'}"
                        >
                    </div>
                `).join('');


                // Generate navigation dots

                const dots = project.screenshots.map((_, index) => `
                    <button
                        class="carousel-dot ${index === 0 ? 'active' : ''}"
                        data-index="${index}"
                        aria-label="${I18N.t('project.goTo')} ${index + 1}"
                    ></button>
                `).join('');


                // Build page

                projectContent.innerHTML = `

                    <h1>${project.title}</h1>

                    <div class="project-carousel">

                        <div class="carousel-container">

                            <div class="carousel-track">
                                ${slides}
                            </div>

                            >

                                class="carousel-btn carousel-next"

                        </div>

                        ${project.description}

                    </div>


                    <div class="project-actions">

                `;


                // CAROUSEL FUNCTIONALITY

                const track = projectContent.querySelector('.carousel-track');

                const prevBtn = projectContent.querySelector('.carousel-prev');

                const nextBtn = projectContent.querySelector('.carousel-next');

                const dotsElements = projectContent.querySelectorAll('.carousel-dot');

                const totalSlides = project.screenshots.length;

                let currentIndex = 0;


                // Hide controls when there is only one screenshot

                if (totalSlides <= 1) {

                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';

                    projectContent.querySelector('.carousel-dots').style.display = 'none';

                }


                // Update carousel

                function updateCarousel() {

                    track.style.transform = `translateX(-${currentIndex * 100}%)`;

                    dotsElements.forEach((dot, index) => {

                        dot.classList.toggle(
                            'active',
                            index === currentIndex
                        );

                    });

                }


                // Previous image

                prevBtn.addEventListener('click', function () {

                    currentIndex = (
                        currentIndex - 1 + totalSlides
                    ) % totalSlides;

                    updateCarousel();

                });


                // Next image

                nextBtn.addEventListener('click', function () {

                    currentIndex = (
                        currentIndex + 1
                    ) % totalSlides;

                    updateCarousel();

                });


                // Navigate using dots

                dotsElements.forEach(dot => {

                    dot.addEventListener('click', function () {

                        currentIndex = Number(this.dataset.index);

                        updateCarousel();

                    });

                });

            } else {

                projectContent.innerHTML = '<h1>' + I18N.t('project.notFound') + '</h1>';
            }
            }

            document.addEventListener('app:languagechange', renderProject);
